name: Follow-up Check

# Measures any video that has passed the 5-hour mark, then keeps re-measuring
# it for as long as it exists - there is no cutoff. Kept separate from the
# upload workflow on purpose: having that job sleep for five hours would burn
# CI minutes doing nothing.
on:
  schedule:
    # Every 3 hours, not hourly - 720 runs/month is not worth it for this.
    # Videos under 48h old are re-measured on EVERY run, because that is the
    # window where views actually move and where the topic-steering signal in
    # predict.py reads from. Past 48h growth has flattened and the interval
    # drops to about daily. Both tiers live in store.recheck_interval_hours().
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit measurements and the regenerated dashboard
  actions: read     # lets the dashboard's Errors section read recent run history

# Both workflows rewrite EVERY video record (followup.sweep re-measures all
# of them) and both commit data/. Two overlapping runs therefore conflict on
# all 40+ record files at once - that is what failed the 2026-08-09, 08-10 and
# 08-11 runs. A shared concurrency group serialises them so the conflict
# cannot arise; scripts/resolve_data_conflicts.py is the safety net for the
# cases this cannot cover, like a push from a developer's machine.
concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-followup.txt

      - name: Run follow-up check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dashboard.build() (called at the end of every run, see agent/followup.py)
          # reads these for the self-improve status shown on the dashboard, and
          # for the one-time approval email - see agent/predict.py.
          SELF_IMPROVE_AFTER: ${{ vars.SELF_IMPROVE_AFTER }}
          SELF_IMPROVE_APPROVED: ${{ vars.SELF_IMPROVE_APPROVED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m agent.followup

      - name: Commit measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "Record 5h measurements"
          # This job runs every 3h and overlaps daily.yml regularly; both
          # commit data/quota_ledger.json, which git cannot merge. See
          # scripts/resolve_data_conflicts.py for why neither file needs a
          # human to settle it.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then break; fi
            python scripts/resolve_data_conflicts.py
            GIT_EDITOR=true git rebase --continue || git rebase --abort
          done
          git push

      - name: Publish dashboard
        if: ${{ vars.DASHBOARD_REPO != '' }}
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
        run: bash scripts/publish_dashboard.sh

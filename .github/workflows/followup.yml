name: Follow-up Check

# Measures any video that has passed the 5-hour mark, then keeps re-measuring
# it for as long as it exists - there is no cutoff. Kept separate from the
# upload workflow on purpose: having that job sleep for five hours would burn
# CI minutes doing nothing.
on:
  schedule:
    # Every 4 hours. Videos under 48h old are re-measured on EVERY run, because
    # that is the window where views actually move and where the topic-steering
    # signal in predict.py reads from. Past 48h growth has flattened and the
    # interval drops to about daily. Both tiers live in
    # store.measurable_records() (store.reading_cadence() names them).
    #
    # WAS every 3 hours until 2026-09-12, and the change is a billing one, not
    # a measurement one. GitHub bills each run rounded UP to a whole minute, so
    # 8 runs/day costs at least 240 minutes a month before doing any work at
    # all; in August this workflow billed 784 minutes against a 2,000-minute
    # allowance the account then blew through. Measured on run 34673322257, a
    # normal pass takes 28 SECONDS and bills a full minute, so the run count is
    # the cost, not the work.
    #
    # Measurement passes barely change: agent/main.py already calls
    # followup.sweep() after every upload, so the channel still gets 6
    # scheduled passes plus 4 post-upload ones — 10 a day against the previous
    # 12 — and the fresh-window tier is unchanged. The 5-hour first reading is
    # unaffected: at 4-hour spacing a video uploaded at any time is still read
    # within an hour of crossing MEASURE_AFTER_HOURS.
    - cron: "15 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit measurements
  actions: read     # lets the dashboard's Errors section read recent run history

# Both workflows rewrite EVERY video record (followup.sweep re-measures all
# of them) and both commit data/. Two overlapping runs therefore conflict on
# all 40+ record files at once - that is what failed the 2026-08-09, 08-10 and
# 08-11 runs. A shared concurrency group serialises them so the conflict
# cannot arise; scripts/resolve_data_conflicts.py is the safety net for the
# cases this cannot cover, like a push from a developer's machine.
concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  measure:
    # A normal follow-up check takes a few minutes, so 30 is generous headroom
    # while still killing a hang far earlier than GitHub's 6-hour default
    # ceiling.
    # Releasing the shared repo-data-writers lock quickly prevents subsequent
    # scheduled runs from being evicted, avoiding the 2026-08-14 incident
    # (run 31766841885) where a 6-hour hang evicted queued runs.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh writer checkout from current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-followup.txt

      - name: Run follow-up check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These are used by the measurement and self-improvement paths. The
          # dashboard itself is rebuilt by weekly.yml, not by every reading.
          SELF_IMPROVE_AFTER: ${{ vars.SELF_IMPROVE_AFTER }}
          SELF_IMPROVE_APPROVED: ${{ vars.SELF_IMPROVE_APPROVED }}
        run: python -m agent.followup

      - name: Commit measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/ is rebuilt and published by weekly.yml. Measurements stay
          # durable here without triggering a dashboard refresh.
          git add data
          git diff --cached --quiet || git commit -m "Record 5h measurements"
          # This job runs every 3h and overlaps daily.yml regularly; both
          # commit data/quota_ledger.json, which git cannot merge. See
          # scripts/resolve_data_conflicts.py for why neither file needs a
          # human to settle it.
          # The push is INSIDE the loop, not after it. It used to run once,
          # unconditionally, after three rebase attempts — so a push that lost
          # the race to another writer BETWEEN the last pull and the push
          # failed the step outright under `bash -e`, throwing away
          # measurements that had already cost their API quota. daily.yml
          # learned this the hard way and was fixed; this job never was, even
          # though it runs every 3h, overlaps daily.yml constantly, and is
          # therefore MORE exposed to that race, not less.
          #
          # A rejected push now re-enters the loop, rebases onto whatever
          # landed, and pushes again. Sleeps are jittered so two writers that
          # collided do not immediately collide again. Five attempts, matching
          # daily.yml.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              python scripts/resolve_data_conflicts.py
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            if git push origin HEAD:main; then pushed=yes; break; fi
            echo "push attempt $attempt was rejected; retrying"
            sleep $(( attempt * 5 + RANDOM % 5 ))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the measurements after 5 attempts"
            exit 1
          fi

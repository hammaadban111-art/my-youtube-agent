name: Replace a video (delete + re-upload)

# The destructive end of the dashboard's "Replace" button.
#
# Manual only. There is no schedule and there never should be: this deletes a
# live video, and spends a delete (50 Data API units, held to the 70% reserve
# line) plus one of the day's 100 upload slots. Uploads stopped costing Data
# API units when Google split videos.insert into its own bucket (see
# agent/quota.py), so the old "1,650 units" figure no longer applies.
#
# The dashboard cannot trigger this itself. It is a static page published to a
# separate PUBLIC repo with no credentials (scripts/publish_dashboard.sh), so
# the button hands the operator a link to this form and GitHub's own login is
# what authorises it. The `confirm` input below is the second gate, after the
# page's confirmation dialog.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video id to replace (e.g. qnAWjYhNlck) — must have a bundle in data/reuse/"
        required: true
      confirm:
        description: "Type the SAME video id again to confirm. This deletes the live video permanently."
        required: true
      dry_run:
        description: "Render only — no upload, no delete, no quota spent"
        type: boolean
        default: true

permissions:
  contents: write   # the new record and the updated old one

# Never two replacements at once, and never a replacement racing another data
# writer's commit of measurements or records. The shared group queues this
# destructive workflow behind daily/follow-up/weekly writers.
concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  replace:
    # One render plus an upload, ~10 minutes. Without a ceiling a hang would
    # hold the shared repo-data-writers lock for GitHub's 6-hour default and
    # evict the scheduled uploads queued behind it.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      # A manual dispatch can be launched from any UI-selected ref.  Records
      # always belong on main, never on that feature branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh writer checkout from current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Allow ImageMagick to render text (moviepy captions)
        run: sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Restore only: daily.yml owns saving the fallback-footage cache (see
      # its comment and agent/visuals.py). A combined actions/cache step here
      # would re-upload it from a rare manual run for nothing.
      - name: Restore Pexels fallback footage cache
        uses: actions/cache/restore@v4
        with:
          path: .pexels_cache
          key: pexels-fallback-${{ github.run_id }}
          restore-keys: |
            pexels-fallback-

      - name: Replace the video
        env:
          # Values from workflow_dispatch are data, not shell syntax.  Keeping
          # them in the environment and quoting their expansion prevents a
          # crafted video id from becoming a second shell command.
          VIDEO_ID: ${{ inputs.video_id }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          NICHE: ${{ vars.NICHE }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          SELF_IMPROVE_AFTER: ${{ vars.SELF_IMPROVE_AFTER }}
          SELF_IMPROVE_APPROVED: ${{ vars.SELF_IMPROVE_APPROVED }}
          DUPLICATE_BLOCK_AFTER: ${{ vars.DUPLICATE_BLOCK_AFTER }}
          # Only spent when the bundle's visual queries are flagged legacy —
          # a normal replace makes zero model calls of any kind.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=("$VIDEO_ID" --confirm "$CONFIRM")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/reupload_video.py "${args[@]}"

      - name: Preserve the render if the upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-replace-${{ github.run_id }}
          path: workdir/pending_upload/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the replacement records
        if: ${{ success() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/ is rebuilt and published by weekly.yml. Keep the
          # replacement records durable without publishing mid-week.
          git add data history
          git diff --cached --quiet || git commit -m "Record replacement"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              python scripts/resolve_data_conflicts.py
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            if git push origin HEAD:main; then pushed=yes; break; fi
            echo "push attempt $attempt was rejected; retrying"
            sleep $(( attempt * 5 + RANDOM % 5 ))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push replacement records after 5 attempts"
            exit 1
          fi

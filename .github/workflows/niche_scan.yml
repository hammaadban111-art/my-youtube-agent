name: Niche Scan

on:
  schedule:
    # Weekly, on measured numbers rather than taste.
    #
    # Cost of one scan, measured by running it: 16 search.list calls of the
    # separate 100 calls/day bucket, and ~20 units of the 10,000 units/day
    # bucket. Weekly averages 2.3 search calls and ~3 units a day, so cadence
    # is not constrained by quota at all - it is constrained by what a re-scan
    # can actually detect.
    #
    # Bootstrapping the derived anchor over 2,000 resamples gives a 95%
    # interval of 624-1,286 around a value of 960: +/-1.5x from sampling noise
    # alone. Two scans run minutes apart already differed by ~6% in the number
    # of Shorts kept, purely from search result churn. So a re-scan only
    # carries information about shifts LARGER than that band, and niche-wide
    # view distributions move on the scale of weeks - channel growth, algorithm
    # changes - not hours. Daily would cost 7x as much to mostly resample the
    # same noise.
    - cron: "40 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # niche_scan.json is committed data too; it must not race a weekly repair,
  # follow-up measurement, or upload record writer.
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh writer checkout from current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-followup.txt

      - name: Run niche scan
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/scan_niche.py

      # The scan's whole point, and until 2026-09-09 the step that did not
      # exist. niche_scan.json was written every Monday, committed, and read by
      # nothing in production; meanwhile benchmark.json's category signal had no
      # refresh path at all and sat 39 days stale while topic selection was
      # meant to be steering on it. Recomputing here costs no API calls — the
      # scan already fetched every number the signal needs.
      - name: Recompute the category signal from the fresh scan
        run: python scripts/refresh_category_signal.py

      - name: Commit niche scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/niche_scan.json data/benchmark.json
          git diff --cached --quiet || git commit -m "Update niche scan results"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              python scripts/resolve_data_conflicts.py
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            if git push origin HEAD:main; then pushed=yes; break; fi
            echo "push attempt $attempt was rejected; retrying"
            sleep $(( attempt * 5 + RANDOM % 5 ))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push niche scan after 5 attempts"
            exit 1
          fi

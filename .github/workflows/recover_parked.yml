name: Recover Parked Videos

# One-off recovery for the 2 videos that rendered fine during the 2026-08-16/17
# outage but never uploaded (invalid_grant token failures) and are sitting as
# GitHub Actions artifacts: run 31921793506 (Torquigener albomaculosus) and run
# 31932620378 (Silphium). A third parked video (run 31895811937, Derinkuyu) was
# already published manually on 2026-08-19 (PBdJxbjUDwQ); a fourth (run
# 31987764872) was dropped as a same-subject duplicate of that one.
#
# Fires twice daily so the 2 remaining videos land within ~48h, spaced apart
# rather than both at once. publish_parked.py's own dedup
# (drop_already_handled) makes every run after the 2nd a fast no-op forever,
# so this is safe to leave running rather than needing to be deleted on a
# precise schedule - delete this file once both are confirmed published.
on:
  schedule:
    - cron: "23 3 * * *"   # ~08:53 IST
    - cron: "23 15 * * *"  # ~20:53 IST
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  recover:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download parked artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parked
          gh run download 31921793506 --repo ${{ github.repository }} --dir parked/run_31921793506 || true
          gh run download 31932620378 --repo ${{ github.repository }} --dir parked/run_31932620378 || true

      - name: Publish one parked video
        env:
          NICHE: ${{ vars.NICHE }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python scripts/publish_parked.py parked/ --max 1

      - name: Persist record
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "Recover a parked video from the 2026-08-16/17 outage"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then break; fi
            python scripts/resolve_data_conflicts.py
            GIT_EDITOR=true git rebase --continue || git rebase --abort
          done
          git push

      - name: Publish dashboard
        if: ${{ vars.DASHBOARD_REPO != '' }}
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
        run: bash scripts/publish_dashboard.sh

name: Faceless YouTube Upload (4x/day)

on:
  schedule:
    # Times are in UTC; IST is UTC+5:30. 2 Gemini calls/video x 4 = 8/day,
    # well under the 20/day free-tier cap for this model (confirmed via a
    # real 429 quota error on 2026-07-30).
    # Minute deliberately offset to :07 instead of :00/:15/:30/:45 — those
    # are the most oversubscribed marks across all of GitHub Actions, and
    # queue delays of 1-3h were observed at :30 on 2026-07-29/30.
    - cron: "7 1 * * *"    # ~07:07 IST
    - cron: "7 6 * * *"    # ~12:07 IST
    - cron: "7 11 * * *"   # ~17:07 IST
    - cron: "7 16 * * *"   # ~22:07 IST
  workflow_dispatch: {}     # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write   # needed to commit the topic history back to the repo
  actions: read     # lets the dashboard's Errors section read recent run history

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Allow ImageMagick to render text (moviepy captions)
        run: sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Generic B-roll categories (fog, ocean, candlelight, etc.) recur
      # across nearly every video by design - see visuals.py's cache. The
      # runner is wiped between runs, so without this the cache would never
      # survive past the run that built it. Keyed by run id with a prefix
      # restore so it always pulls the most recent cache and grows over
      # time; GitHub evicts old entries under its 10GB/repo cache limit.
      - name: Restore Pexels footage cache
        uses: actions/cache@v4
        with:
          path: .pexels_cache
          key: pexels-cache-${{ github.run_id }}
          restore-keys: |
            pexels-cache-

      - name: Run agent
        env:
          NICHE: ${{ vars.NICHE }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          # Holds the self-improving stage shut until this date. Set while the
          # channel was recovering from the 2026-07-30 distribution throttle,
          # so the model never trains on suppressed videos. Clear the repo
          # Variable to release it.
          SELF_IMPROVE_AFTER: ${{ vars.SELF_IMPROVE_AFTER }}
          # One-time human approval gate for self-improving mode (separate from
          # the date brake above) - see agent/predict.py's _request_approval_once.
          SELF_IMPROVE_APPROVED: ${{ vars.SELF_IMPROVE_APPROVED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.main

      # workdir/ is gitignored and the runner is wiped between runs, so a
      # video parked by a failed upload would otherwise be lost despite being
      # saved locally. Retained as an artifact so it can actually be recovered.
      - name: Preserve unuploaded video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unuploaded-video-${{ github.run_id }}
          path: workdir/pending_upload/
          retention-days: 7
          if-no-files-found: ignore

      # This repo is PRIVATE so Actions artifact storage counts against the
      # limited free quota; 14 days is a deliberate compromise, roughly 4
      # videos/day at ~15-20MB each.
      #
      # The path is final_video.mp4 specifically, NOT workdir/*.mp4 — the
      # workdir also holds the ~15 downloaded B-roll clips (clip_N_N.mp4,
      # 2-6MB each), and a glob would archive ~40MB of recoverable Pexels
      # footage per run on top of the one file that actually matters.
      #
      # success() matters too: on failure the step above already preserves
      # the video from workdir/pending_upload/, and without this guard both
      # steps would fire and store the same footage twice.
      - name: Archive rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: workdir/final_video.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Persist topic history and video record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/topics.json data public
          git diff --cached --quiet || git commit -m "Record video, prediction and topic history"
          git pull --rebase --autostash origin main
          git push

      - name: Publish dashboard
        if: ${{ vars.DASHBOARD_REPO != '' }}
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
        run: bash scripts/publish_dashboard.sh

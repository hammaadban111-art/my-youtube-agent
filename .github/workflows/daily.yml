name: Faceless YouTube Upload (4x/day)

on:
  schedule:
    # Times are in UTC; IST is UTC+5:30, so these fire at 06:37, 11:37, 16:37
    # and 21:37 IST. FOUR SLOTS A DAY — agent/cadence.py mirrors this list and
    # agent/packet.py counts it to decide how many stories a week needs
    # (4 x 7 = 28). Change one and change the other, or the weekly packet
    # will have gaps.
    #
    # Minute deliberately offset to :07 instead of :00/:15/:30/:45 — those
    # are the most oversubscribed marks across all of GitHub Actions, and
    # queue delays of 1-3h were observed at :30 on 2026-07-29/30.
    - cron: "7 1 * * *"    # 06:37 IST
    - cron: "7 6 * * *"    # 11:37 IST
    - cron: "7 11 * * *"   # 16:37 IST
    - cron: "7 16 * * *"   # 21:37 IST
  workflow_dispatch: {}     # lets you also trigger it manually from GitHub's UI
  # Callable by story-packet.yml, so a freshly committed packet can pick up a
  # slot that is already due instead of waiting for the next cron. Reused
  # rather than copied: one pipeline definition, one set of guardrails.
  workflow_call: {}

permissions:
  contents: write   # needed to commit the topic history back to the repo
  actions: read     # lets the dashboard's Errors section read recent run history

# Both workflows rewrite EVERY video record (followup.sweep re-measures all
# of them) and both commit data/. Two overlapping runs therefore conflict on
# all 40+ record files at once - that is what failed the 2026-08-09, 08-10 and
# 08-11 runs. A shared concurrency group serialises them so the conflict
# cannot arise; scripts/resolve_data_conflicts.py is the safety net for the
# cases this cannot cover, like a push from a developer's machine.
concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  generate-and-upload:
    # A normal daily run takes ~11 minutes. It used to be able to spend up to
    # 15 more waiting out a text-model outage; that whole class of delay left
    # with the model (agent/packet.py), so 45 minutes is now very generous
    # headroom while still killing a hang 5+ hours earlier than GitHub's
    # 6-hour default ceiling. Releasing
    # the shared repo-data-writers lock quickly prevents subsequent scheduled
    # runs from being evicted, which occurred on 2026-08-14 when run 31766841885
    # hung for 6 hours and evicted two queued runs.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Allow ImageMagick to render text (moviepy captions)
        run: sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The pre-flight. The pipeline no longer writes its own stories, so a
      # missing, malformed or exhausted packet means this slot has nothing to
      # publish — and that has to be discovered HERE, in two seconds, not
      # eleven minutes into a render. --require-slot makes "no story is due"
      # a failure too: on a scheduled run it is one.
      #
      # There is deliberately no fallback generator behind this check.
      #
      # It fails the run for a missing, malformed or EXHAUSTED packet. It does
      # NOT fail for "no story is due", which only means every story planned up
      # to now has already gone out — the `due` output below skips the pipeline
      # instead. GitHub fired a scheduled run 3h40m late on 2026-09-07, for a
      # slot another run had already served, and a red run plus an alert email
      # is the wrong answer to a healthy channel being slightly ahead.
      # PACKET_ALLOW_EARLY is set only for a MANUAL dispatch. A scheduled run
      # outside every slot is a scheduler fault worth failing on, and letting
      # one run early would drain the week ahead of schedule — but a person
      # recovering a missed slot, or checking the pipeline end to end, has to
      # be able to publish the next pending story. This is the "manual
      # recovery" half of the packet-driven design.
      - name: Validate the weekly story packet
        id: packet
        env:
          PACKET_ALLOW_EARLY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m agent.packet --validate --require-slot

      # Generic B-roll categories (fog, ocean, candlelight, etc.) recur
      # across nearly every video by design - see visuals.py's cache. The
      # runner is wiped between runs, so without this the cache would never
      # survive past the run that built it. Keyed by run id with a prefix
      # restore so it always pulls the most recent cache and grows over
      # time; GitHub evicts old entries under its 10GB/repo cache limit.
      - name: Restore Pexels footage cache
        uses: actions/cache@v4
        with:
          path: .pexels_cache
          key: pexels-cache-${{ github.run_id }}
          restore-keys: |
            pexels-cache-

      # The runner is wiped between runs, so agent/checkpoint.py's state.json
      # would never outlive the run that wrote it — and outliving it is the
      # entire point. A crash between the upload and the record write leaves a
      # video public with nothing describing it (2026-08-03, 08-05, 08-09);
      # restoring the checkpoint is what lets the next slot finish that record
      # instead of starting a whole new video.
      #
      # restore/save are split, and save runs with `always()`, because the
      # combined `actions/cache` action does not save when the job fails —
      # which is precisely and only when there is a checkpoint worth keeping.
      #
      # Staleness is NOT this cache's problem to solve: restore-keys always
      # pulls the newest checkpoint- entry, and checkpoint.py refuses anything
      # older than its 5-hour TTL, from a different niche, or from a different
      # schema. The cache is a transport, not the authority.
      - name: Restore pipeline checkpoint
        uses: actions/cache/restore@v4
        with:
          path: workdir/checkpoint
          key: checkpoint-${{ github.run_id }}
          restore-keys: |
            checkpoint-

      - name: Run agent
        if: ${{ steps.packet.outputs.due == 'true' }}
        env:
          NICHE: ${{ vars.NICHE }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
          # See the validation step above: manual dispatches may claim the next
          # pending story without waiting for its slot; scheduled runs may not.
          PACKET_ALLOW_EARLY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Holds the self-improving stage shut until this date. Set while the
          # channel was recovering from the 2026-07-30 distribution throttle,
          # so the model never trains on suppressed videos. Clear the repo
          # Variable to release it.
          SELF_IMPROVE_AFTER: ${{ vars.SELF_IMPROVE_AFTER }}
          # One-time human approval gate for self-improving mode (separate from
          # the date brake above) - see agent/predict.py's _request_approval_once.
          SELF_IMPROVE_APPROVED: ${{ vars.SELF_IMPROVE_APPROVED }}
          # B2 (duplicate topic detection) holds until this date - Group B lands
          # one change at a time, >=48h apart, and B1 landed 2026-08-05. Unset
          # falls back to the 2026-08-07 default in agent/history.py; a
          # malformed value holds rather than releasing early.
          DUPLICATE_BLOCK_AFTER: ${{ vars.DUPLICATE_BLOCK_AFTER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.main

      # always(), not success(): a checkpoint is only worth carrying forward
      # when the run did NOT finish, and a successful run leaves the directory
      # empty (agent/main.py clears it once the record is written), so the
      # entry this saves is a clean slate rather than a stale script. mkdir
      # guarantees the path exists either way — cache/save warns and skips on a
      # missing path, which would leave the PREVIOUS run's entry as the newest
      # match for the next restore.
      - name: Save pipeline checkpoint
        if: ${{ always() }}
        run: mkdir -p workdir/checkpoint

      - name: Persist pipeline checkpoint
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: workdir/checkpoint
          key: checkpoint-${{ github.run_id }}

      # workdir/ is gitignored and the runner is wiped between runs, so a
      # video parked by a failed upload would otherwise be lost despite being
      # saved locally. Retained as an artifact so it can actually be recovered.
      - name: Preserve unuploaded video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unuploaded-video-${{ github.run_id }}
          path: workdir/pending_upload/
          retention-days: 7
          if-no-files-found: ignore

      # This repo is PRIVATE so Actions artifact storage counts against the
      # limited free quota; 14 days is a deliberate compromise, roughly 4
      # videos/day at ~15-20MB each.
      #
      # The path is final_video.mp4 specifically, NOT workdir/*.mp4 — the
      # workdir also holds the ~15 downloaded B-roll clips (clip_N_N.mp4,
      # 2-6MB each), and a glob would archive ~40MB of recoverable Pexels
      # footage per run on top of the one file that actually matters.
      #
      # success() matters too: on failure the step above already preserves
      # the video from workdir/pending_upload/, and without this guard both
      # steps would fire and store the same footage twice.
      - name: Archive rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_id }}
          path: workdir/final_video.mp4
          retention-days: 14
          if-no-files-found: ignore

      # Runs even when an earlier step failed: by this point the video may
      # already be live on YouTube, and losing its record is worse than the
      # failure that got us here. Three videos were published with no record
      # on 2026-08-03/05/09 because this step was skipped or died.
      - name: Persist topic history and video record
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/topics.json data public content
          git diff --cached --quiet || git commit -m "Record video, prediction and topic history"
          # Two overlapping runs conflict on quota_ledger.json and topics.json,
          # neither of which git can merge and neither of which needs a human.
          # Without this the rebase stops, the step exits 1, and the record for
          # an already-published video is lost with the runner.
          #
          # The push is inside the loop, not after it. It used to run once,
          # unconditionally, after three rebase attempts: a push that lost a
          # race to another writer between the last pull and the push failed
          # the step outright under `bash -e`, discarding the record for a
          # video that was already public — the exact loss this step exists to
          # prevent. Now a rejected push simply re-enters the loop, rebases on
          # whatever landed, and pushes again. Sleeps are jittered so two
          # writers that collided do not immediately collide again.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              python scripts/resolve_data_conflicts.py
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            if git push; then pushed=yes; break; fi
            echo "push attempt $attempt was rejected; retrying"
            sleep $(( attempt * 5 + RANDOM % 5 ))
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the video record after 5 attempts"
            exit 1
          fi

      - name: Publish dashboard
        if: ${{ steps.packet.outputs.due == 'true' && vars.DASHBOARD_REPO != '' }}
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
        run: bash scripts/publish_dashboard.sh

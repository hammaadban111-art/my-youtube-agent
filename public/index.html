<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mystery Machine — Autonomous Shorts Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f5f2ec; --ink:#17150f; --ink-2:#4a463c; --ink-3:#8a8577;
  --rule:rgba(23,21,15,.16); --rule-2:rgba(23,21,15,.08); --wash:rgba(23,21,15,.035);
  --signal:oklch(0.55 0.19 33);
  --slate:oklch(0.45 0.05 250);
  --good:oklch(0.47 0.10 152);
}
[data-theme="dark"]{
  --paper:#111009; --ink:#eeeade; --ink-2:#a8a293; --ink-3:#6f6b5e;
  --rule:rgba(238,234,222,.20); --rule-2:rgba(238,234,222,.10); --wash:rgba(238,234,222,.04);
  --signal:oklch(0.70 0.17 40);
  --slate:oklch(0.72 0.06 250);
  --good:oklch(0.72 0.12 152);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 24px 16px 64px;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
}

h1, h2, h3, h4 { margin: 0; font-weight: normal; }

.serif-title {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-weight: 500;
}
.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

/* Header */
.site-header {
  margin-bottom: 20px;
}
.header-top {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (min-width: 640px) {
  .header-top {
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
  }
}
.header-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.header-date {
  font-size: 11px;
  color: var(--ink-3);
  margin-right: 4px;
}
.header-rule {
  border-bottom: 2px solid var(--ink);
  margin-top: 14px;
}

/* Controls / Buttons */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 5px 10px;
  border-radius: 2px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}
.btn:hover {
  border-color: var(--ink-2);
  background: var(--wash);
}
.btn.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.btn-group {
  display: inline-flex;
  gap: 4px;
}

/* Status strip */
.status-strip {
  font-family: var(--mono);
  font-size: 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-2);
  color: var(--ink-2);
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border: 1px solid var(--rule);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.status-pill.good { color: var(--good); border-color: var(--good); }
.status-pill.signal { color: var(--signal); border-color: var(--signal); }
.status-pill.dim { color: var(--ink-3); border-color: var(--rule); }

.freshness-pill {
  font-size: 11px;
  color: var(--ink-3);
  padding: 2px 6px;
  border: 1px solid var(--rule-2);
  margin-left: auto;
}

/* Self-improve banner */
.self-improve-banner {
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule-2);
}
.self-improve-banner.dim { color: var(--ink-3); }
.self-improve-banner.signal { color: var(--signal); font-weight: 500; }
.self-improve-banner.good { color: var(--good); font-weight: 500; }

/* Channel summary */
.channel-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin: 20px 0;
}
@media (min-width: 600px) {
  .channel-summary { grid-template-columns: repeat(4, 1fr); }
}
.cs-item {
  border: 1px solid var(--rule);
  padding: 14px 16px;
  text-align: center;
}
.cs-value {
  font-size: 24px;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.cs-label {
  margin-top: 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-3);
}

/* Section Header */
.section-header {
  margin: 28px 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
}
.section-title {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  color: var(--ink);
}
.section-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}

/* Twin Spotlight */
.spotlight-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 600px) {
  .spotlight-grid { grid-template-columns: 1fr 1fr; }
}
.spotlight-card {
  border: 1px solid var(--rule);
  padding: 16px;
  background: transparent;
}
.spotlight-title {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.25;
  margin: 6px 0 4px;
}
.spotlight-title a { color: var(--ink); text-decoration: none; }
.spotlight-title a:hover { text-decoration: underline; }

.spotlight-metrics {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 12px 0 4px;
}
.spotlight-views {
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
}
.spotlight-sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 12px;
}
.delta-pill {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 2px;
}
.delta-pill.pos { color: var(--good); background: rgba(47, 120, 80, 0.08); }
.delta-pill.neg { color: var(--signal); background: rgba(180, 50, 20, 0.08); }

.spotlight-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  border-top: 1px solid var(--rule-2);
  padding-top: 10px;
}
.stat-block { display: flex; flex-direction: column; }
.stat-val { font-size: 13px; font-weight: 500; }
.stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }

/* Chart Section */
.chart-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 1px;
}
.chart-container {
  border: 1px solid var(--rule-2);
  padding: 12px 8px 4px;
  background: var(--paper);
}
.chart-tooltip {
  position: absolute;
  top: 10px;
  right: 15px;
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  pointer-events: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.tooltip-date {
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--ink);
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tooltip-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* CI Budget & Incidents */
.card-box {
  border: 1px solid var(--rule);
  padding: 14px;
  background: transparent;
}
.ci-progress-bar {
  height: 8px;
  background: var(--rule-2);
  position: relative;
  margin: 10px 0;
}
.ci-fill {
  height: 100%;
  transition: width 0.3s;
}
.ci-fill.good { background: var(--good); }
.ci-fill.warning { background: var(--slate); }
.ci-fill.critical { background: var(--signal); }

.ci-marker {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 2px;
  background: var(--ink-3);
  z-index: 2;
}
.ci-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-3);
}

.failures-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.failure-item {
  border-left: 2px solid var(--signal);
  padding-left: 10px;
  font-size: 12px;
}
.failure-head {
  display: flex;
  justify-content: space-between;
  font-weight: 500;
}
.failure-wf { color: var(--ink); }
.failure-time { color: var(--ink-3); font-size: 11px; }
.failure-err { color: var(--ink-2); margin-top: 2px; word-break: break-word; }

/* Top Performers */
.top-performers-list {
  border: 1px solid var(--rule-2);
  display: flex;
  flex-direction: column;
}
.tp-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule-2);
}
.tp-row:last-child { border-bottom: none; }
.tp-rank {
  font-size: 12px;
  color: var(--ink-3);
  width: 20px;
}
.tp-main {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.tp-subject {
  font-weight: 600;
  color: var(--ink);
}
.tp-title {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--ink-2);
}
.tp-views {
  font-size: 13px;
  color: var(--ink);
  white-space: nowrap;
}

/* Published Shorts Table */
.table-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}
.input-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 6px 10px;
  border-radius: 2px;
  flex: 1 1 200px;
}
.input-text:focus {
  outline: none;
  border-color: var(--ink-2);
}
.select-box {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 5px 8px;
  border-radius: 2px;
  cursor: pointer;
}

.table-container {
  border: 1px solid var(--rule-2);
}
.video-row {
  padding: 12px 14px;
  border-bottom: 1px solid var(--rule-2);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.video-row:last-child { border-bottom: none; }

.row-line1 {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.row-num {
  font-size: 11px;
  color: var(--ink-3);
  width: 24px;
  flex-shrink: 0;
}
.row-title {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.25;
  flex: 1 1 260px;
}
.row-title a { color: var(--ink); text-decoration: none; }
.row-title a:hover { text-decoration: underline; }

.row-views {
  font-size: 14px;
  font-weight: 500;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.pending { font-style: italic; color: var(--ink-3); font-weight: normal; }

.row-line2 {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 11px;
  color: var(--ink-2);
  flex-wrap: wrap;
  padding-left: 34px;
}
.row-stat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.sparkline { vertical-align: middle; }

.row-degradation {
  font-size: 11px;
  color: var(--signal);
  padding-left: 34px;
}

/* Replace (delete + re-upload) */
.btn-replace {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--signal);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 2px 7px;
  border-radius: 2px;
  cursor: pointer;
}
.btn-replace:hover { border-color: var(--signal); background: var(--wash); }
.btn-replace[disabled] {
  color: var(--ink-3);
  cursor: not-allowed;
  opacity: 0.6;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 50;
}
.modal {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 3px;
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
}
.modal h3 {
  font-family: var(--serif);
  font-size: 20px;
  margin: 0 0 12px;
}
.modal ul { margin: 8px 0 0; padding-left: 18px; }
.modal li { margin-bottom: 5px; font-size: 12px; color: var(--ink-2); }
.modal-warn {
  color: var(--signal);
  border-left: 2px solid var(--signal);
  padding-left: 10px;
  margin: 12px 0;
  font-size: 12px;
}
.modal-cmd {
  font-size: 11px;
  background: var(--wash);
  border: 1px solid var(--rule-2);
  padding: 8px;
  border-radius: 2px;
  overflow-x: auto;
  white-space: pre;
  margin: 10px 0 0;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
  flex-wrap: wrap;
}

/* Badges */
.badge {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 6px;
  border: 1px solid var(--rule);
  border-radius: 2px;
  white-space: nowrap;
}
.badge.good { color: var(--good); border-color: rgba(47, 120, 80, 0.3); }
.badge.signal { color: var(--signal); border-color: rgba(180, 50, 20, 0.3); }
.badge.dim { color: var(--ink-3); border-color: var(--rule-2); }

/* Comments */
.comments-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 600px) {
  .comments-grid { grid-template-columns: 1fr 1fr; }
}
.comment-card {
  margin: 0;
  padding: 12px 14px;
  border: 1px solid var(--rule-2);
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.comment-topic {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-3);
}
.comment-body {
  font-family: var(--serif);
  font-size: 14px;
  font-style: italic;
  margin: 0;
  color: var(--ink);
}
.comment-footer {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-2);
  margin-top: 4px;
}

/* Empty State */
.empty-state {
  padding: 24px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12px;
}

/* Footer */
.site-footer {
  margin-top: 48px;
}
.footer-rule {
  border-bottom: 1px solid var(--rule-2);
  margin-bottom: 16px;
}
.footer-text {
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="empty-state">Loading console…</div></div>
</div>
<!-- Lives outside #app so a background data refresh can't tear down an open
     confirmation dialog mid-read. -->
<div id="modalRoot"></div>

<script>
const REFRESH_MS = 30000;
let DATA = null;
let lastFetch = null;
let currentTheme = "light";
let searchQuery = "";
let activeFilter = "all";
let sortOrder = "newest";
let chartRange = "all";
let showViews = true;
let showRetention = true;
let showForecast = true;
let hoverIdx = null;
let channelRange = "all";
let channelHoverIdx = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const num = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString();

function ago(iso) {
  if (!iso) return "unknown";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function until(iso) {
  if (!iso) return "unknown";
  const s = (new Date(iso).getTime() - Date.now()) / 1000;
  if (s <= 0) return "due now";
  if (s < 3600) return "in " + Math.floor(s / 60) + "m";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return "in " + h + "h" + (m ? " " + m + "m" : "");
}

// Every date/time shown on this page is pinned to IST regardless of the
// viewer's own device timezone - requested 2026-08-02 so the numbers read
// the same for hammaad wherever the dashboard is opened from. JS Date's own
// getters (getMonth/getDate/toLocaleDateString without a timeZone) reflect
// the VIEWER's local timezone, not IST, so every absolute date/time display
// goes through Intl.DateTimeFormat with an explicit timeZone instead.
const IST_TZ = "Asia/Kolkata";

function istParts(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: IST_TZ, year: "numeric", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  }).formatToParts(d);
  const get = t => parts.find(p => p.type === t)?.value || "";
  return { month: get("month"), day: get("day"), year: get("year"),
           hour: get("hour"), minute: get("minute"), dayPeriod: get("dayPeriod") };
}

function shortDate(iso) {
  if (!iso) return "—";
  const p = istParts(iso);
  return p ? `${p.month} ${p.day}, ${p.year}` : "—";
}

function istDateTime(iso) {
  if (!iso) return "—";
  const p = istParts(iso);
  return p ? `${p.month} ${p.day}, ${p.hour}:${p.minute} ${p.dayPeriod} IST` : "—";
}

function axisDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: IST_TZ, month: "numeric", day: "numeric",
  }).formatToParts(d);
  const get = t => parts.find(p => p.type === t)?.value || "";
  return `${get("month")}/${get("day")}`;
}

function daysBetween(startIso, endIso) {
  const a = new Date(startIso), b = new Date(endIso);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

function freshnessLabel(v) {
  if (v.final) {
    const days = daysBetween(v.uploaded_at, v.finalized_at);
    return days !== null ? `Final as of ${days} days` : "Final";
  }
  return v.measured_at ? "Updated " + ago(v.measured_at) : "Not yet measured";
}

function freshnessRowHtml(v) {
  if (v.final) {
    const days = daysBetween(v.uploaded_at, v.finalized_at);
    return `Final: <b>${days !== null ? "as of " + days + " days" : "yes"}</b>`;
  }
  return v.measured_at ? `Updated <b>${esc(ago(v.measured_at))}</b>` : "<b>Not yet measured</b>";
}

function istTodayYMD() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: IST_TZ, year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date());
  const get = t => parseInt(parts.find(p => p.type === t)?.value, 10);
  return { year: get("year"), month: get("month"), day: get("day") };
}

function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved) {
    currentTheme = saved;
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    currentTheme = "dark";
  } else {
    currentTheme = "light";
  }
  applyTheme();
}

function applyTheme() {
  if (currentTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}

function toggleTheme() {

function buildPathWithGaps(pts) {
  let d = "";
  let inSegment = false;
  for (let i = 0; i < pts.length; i++) {
    const pt = pts[i];
    if (pt) {
      if (!inSegment) {
        const nextPt = (i + 1 < pts.length) ? pts[i + 1] : null;
        if (!nextPt) {
          d += (d ? " " : "") + "M" + pt[0].toFixed(1) + " " + pt[1].toFixed(1) + " L" + pt[0].toFixed(1) + " " + pt[1].toFixed(1);
          inSegment = false;
        } else {
          d += (d ? " " : "") + "M" + pt[0].toFixed(1) + " " + pt[1].toFixed(1);
          inSegment = true;
        }
      } else {
        d += " L" + pt[0].toFixed(1) + " " + pt[1].toFixed(1);
        if (i + 1 >= pts.length || !pts[i + 1]) {
          inSegment = false;
        }
      }
    } else {
      inSegment = false;
    }
  }
  return d;
}

function retentionSparkline(curve) {
  if (!curve || !curve.length) return "";
  const W = 60, H = 14;
  const pts = curve.map(p => [
    p.position * W,
    H - Math.max(0, Math.min(1, p.watch_ratio)) * H
  ]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg width="${W}" height="${H}" class="sparkline" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="${path}" fill="none" stroke="var(--slate)" stroke-width="1.5"/>
  </svg>`;
}

function buildChannelTimeline(videos) {
  // Every (timestamp, video, views) reading across the whole channel, from
  // each video's own reading history - not aligned to common time buckets,
  // so this reconstructs a combined running total at every distinct
  // timestamp any video was ever read at.
  const points = [];
  (videos || []).forEach(v => {
    (v.history || []).forEach(h => {
      const t = new Date(h.measured_at).getTime();
      if (!isNaN(t) && h.actual_views !== null && h.actual_views !== undefined) {
        points.push({ t, id: v.n, views: h.actual_views });
      }
    });
  });
  points.sort((a, b) => a.t - b.t);

  const times = [...new Set(points.map(p => p.t))].sort((a, b) => a - b);
  const latestByVideo = {};
  let idx = 0;
  const series = [];
  for (const t of times) {
    while (idx < points.length && points[idx].t <= t) {
      latestByVideo[points[idx].id] = points[idx].views;
      idx++;
    }
    const total = Object.values(latestByVideo).reduce((a, b) => a + b, 0);
    series.push({ t, total });
  }
  return series;
}

function renderChannelTotalChart(videos) {
  const fullSeries = buildChannelTimeline(videos);
  if (fullSeries.length < 2) return "";

  let series = fullSeries;
  if (channelRange !== "all") {
    const days = parseInt(channelRange, 10);
    const cutoff = Date.now() - days * 86400000;
    let baseIdx = 0;
    for (let i = 0; i < fullSeries.length; i++) {
      if (fullSeries[i].t <= cutoff) baseIdx = i; else break;
    }
    series = fullSeries.slice(baseIdx);
  }
  if (series.length < 2) series = fullSeries.slice(-2);

  const firstDate = shortDate(new Date(series[0].t).toISOString());
  const lastDate = shortDate(new Date(series[series.length - 1].t).toISOString());

  const W = 800, H = 200;
  const padL = 55, padR = 15, padT = 16, padB = 30;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const minT = series[0].t, maxT = series[series.length - 1].t;
  const spanT = Math.max(1, maxT - minT);
  const maxV = Math.max(...series.map(p => p.total));
  const spanV = Math.max(1, maxV);

  const getX = t => padL + ((t - minT) / spanT) * chartW;
  const getY = v => padT + (1 - v / spanV) * chartH;

  const linePts = series.map(p => [getX(p.t), getY(p.total)]);
  const lineD = linePts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const areaD = lineD + ` L ${linePts[linePts.length - 1][0].toFixed(1)} ${(H - padB).toFixed(1)}`
              + ` L ${linePts[0][0].toFixed(1)} ${(H - padB).toFixed(1)} Z`;

  let gridlines = "", yLabels = "";
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const val = (t / ticks) * spanV;
    const y = getY(val);
    gridlines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--rule-2)" stroke-width="1" />`;
    yLabels += `<text x="${padL - 6}" y="${(y + 4).toFixed(1)}" font-family="var(--mono)" font-size="10" fill="var(--ink-3)" text-anchor="end">${num(Math.round(val))}</text>`;
  }

  let xLabels = "";
  // Ticks here are spaced by TIME, not index - readings often cluster in
  // bursts (many videos measured minutes apart), so an index-based "every
  // Nth point" gap can still land two ticks pixels apart. Checked in actual
  // pixel distance instead, against the last tick (which is always drawn).
  const step = Math.max(1, Math.floor(series.length / 6));
  const lastX = getX(series[series.length - 1].t);
  const MIN_TICK_GAP_PX = 40;
  series.forEach((p, i) => {
    const isLast = i === series.length - 1;
    const x = getX(p.t);
    const isStepTick = i % step === 0 && !isLast && Math.abs(lastX - x) >= MIN_TICK_GAP_PX;
    if (isStepTick || isLast) {
      xLabels += `<text x="${x.toFixed(1)}" y="${H - 10}" font-family="var(--mono)" font-size="10" fill="var(--ink-3)" text-anchor="middle">${axisDate(new Date(p.t).toISOString())}</text>`;
    }
  });

  let hoverElements = "", tooltip = "";
  if (channelHoverIdx !== null && channelHoverIdx >= 0 && channelHoverIdx < series.length) {
    const p = series[channelHoverIdx];
    const x = getX(p.t);
    hoverElements = `
      <line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H - padB}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="${x.toFixed(1)}" cy="${getY(p.total).toFixed(1)}" r="5" fill="var(--signal)" stroke="var(--paper)" stroke-width="1.5" />
    `;
    tooltip = `
      <div class="chart-tooltip">
        <div class="tooltip-date">${esc(istDateTime(new Date(p.t).toISOString()))}</div>
        <div class="tooltip-row"><span>Total views: <b>${num(p.total)}</b></span></div>
      </div>
    `;
  }

  return `
    <div class="section-header">
      <div>
        <div class="section-title">Channel Total Views Over Time</div>
        <div class="section-sub">Combined views across every tracked video · ${esc(firstDate)} – ${esc(lastDate)}</div>
      </div>
      <div class="chart-controls">
        <div class="btn-group">
          <button class="btn ${channelRange === '7' ? 'active' : ''}" onclick="setChannelRange('7')">7D</button>
          <button class="btn ${channelRange === '14' ? 'active' : ''}" onclick="setChannelRange('14')">14D</button>
          <button class="btn ${channelRange === '30' ? 'active' : ''}" onclick="setChannelRange('30')">30D</button>
          <button class="btn ${channelRange === 'all' ? 'active' : ''}" onclick="setChannelRange('all')">All</button>
        </div>
      </div>
    </div>
    <div class="chart-container" style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" role="img"
           onmousemove="handleChannelChartHover(event, ${series.length})"
           onmouseleave="hideChannelChartHover()">
        ${gridlines}
        ${yLabels}
        ${xLabels}
        <path d="${areaD}" fill="var(--wash)" />
        <path d="${lineD}" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
        ${hoverElements}
      </svg>
      ${tooltip}
    </div>
  `;
}

function renderChartSection(videos) {
  if (!videos) return "";
  const realViews = videos.map(v => v.actual_views).filter(v => v !== null && v !== undefined);
  if (realViews.length < 2) return "";

  let chartVideos = videos.slice().reverse();
  if (chartRange === '7') chartVideos = chartVideos.slice(-7);
  else if (chartRange === '14') chartVideos = chartVideos.slice(-14);
  else if (chartRange === '30') chartVideos = chartVideos.slice(-30);

  if (chartVideos.length < 2) return "";

  const firstDate = shortDate(chartVideos[0].uploaded_at);
  const lastDate = shortDate(chartVideos[chartVideos.length - 1].uploaded_at);
  const dateSpan = `Per video · ${firstDate} – ${lastDate}`;

  let allViewVals = [];
  chartVideos.forEach(v => {
    if (v.actual_views !== null && v.actual_views !== undefined) allViewVals.push(v.actual_views);
    if (v.predicted_low !== null && v.predicted_low !== undefined) allViewVals.push(v.predicted_low);
    if (v.predicted_high !== null && v.predicted_high !== undefined) allViewVals.push(v.predicted_high);
  });
  if (allViewVals.length === 0) allViewVals = [0, 10];
  let maxV = Math.max(...allViewVals);
  let minV = Math.min(0, ...allViewVals);
  if (maxV === minV) maxV += 10;
  const spanV = maxV - minV;

  const W = 800, H = 220;
  const padL = 45, padR = 25, padT = 20, padB = 35;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const getX = i => padL + (i / (chartVideos.length - 1)) * chartW;
  const getYViews = v => padT + (1 - (v - minV) / spanV) * chartH;
  const getYRet = r => padT + (1 - Math.max(0, Math.min(1, r))) * chartH;

  let forecastBands = "";
  if (showForecast) {
    let currentSeg = [];
    let segments = [];
    chartVideos.forEach((v, idx) => {
      if (v.predicted_low !== null && v.predicted_low !== undefined &&
          v.predicted_high !== null && v.predicted_high !== undefined) {
        currentSeg.push({ idx, x: getX(idx), low: getYViews(v.predicted_low), high: getYViews(v.predicted_high) });
      } else {
        if (currentSeg.length > 0) { segments.push(currentSeg); currentSeg = []; }
      }
    });
    if (currentSeg.length > 0) segments.push(currentSeg);

    forecastBands = segments.map(seg => {
      if (seg.length < 2) {
        const s = seg[0];
        return `<line x1="${s.x.toFixed(1)}" y1="${s.high.toFixed(1)}" x2="${s.x.toFixed(1)}" y2="${s.low.toFixed(1)}" stroke="var(--slate)" stroke-dasharray="3 3" opacity="0.6"/>`;
      }
      let pathD = "M " + seg.map(p => `${p.x.toFixed(1)} ${p.high.toFixed(1)}`).join(" L ") +
                  " L " + seg.slice().reverse().map(p => `${p.x.toFixed(1)} ${p.low.toFixed(1)}`).join(" L ") + " Z";

      let topD = "M " + seg.map(p => `${p.x.toFixed(1)} ${p.high.toFixed(1)}`).join(" L ");
      let botD = "M " + seg.map(p => `${p.x.toFixed(1)} ${p.low.toFixed(1)}`).join(" L ");

      return `
        <path d="${pathD}" fill="var(--wash)" />
        <path d="${topD}" fill="none" stroke="var(--slate)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
        <path d="${botD}" fill="none" stroke="var(--slate)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
      `;
    }).join("");
  }

  let viewsPath = "";
  let viewsDots = "";
  if (showViews) {
    const ptsViews = chartVideos.map((v, i) =>
      (v.actual_views !== null && v.actual_views !== undefined) ? [getX(i), getYViews(v.actual_views)] : null
    );
    const dViews = buildPathWithGaps(ptsViews);
    if (dViews) {
      viewsPath = `<path d="${dViews}" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`;
    }
    viewsDots = ptsViews.filter(p => p !== null).map(p =>
      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--signal)" />`
    ).join("");
  }

  let retPath = "";
  if (showRetention) {
    const ptsRet = chartVideos.map((v, i) => {
      const r = (v.retention && v.retention.available && v.retention.retention_at_end !== null && v.retention.retention_at_end !== undefined)
        ? v.retention.retention_at_end
        : null;
      return r !== null ? [getX(i), getYRet(r)] : null;
    });
    const dRet = buildPathWithGaps(ptsRet);
    if (dRet) {
      retPath = `<path d="${dRet}" fill="none" stroke="var(--slate)" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round" />`;
    }
  }

  let gridlines = "";
  let yLabels = "";
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const val = minV + (t / ticks) * spanV;
    const y = getYViews(val);
    gridlines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--rule-2)" stroke-width="1" />`;
    yLabels += `<text x="${padL - 6}" y="${(y + 4).toFixed(1)}" font-family="var(--mono)" font-size="10" fill="var(--ink-3)" text-anchor="end">${Math.round(val)}</text>`;
  }

  let xLabels = "";
  const step = Math.max(1, Math.floor(chartVideos.length / 6));
  chartVideos.forEach((v, i) => {
    const isLast = i === chartVideos.length - 1;
    const isStepTick = i % step === 0 && !isLast && (chartVideos.length - 1 - i) >= step / 2;
    if (isStepTick || isLast) {
      const x = getX(i);
      xLabels += `<text x="${x.toFixed(1)}" y="${H - 10}" font-family="var(--mono)" font-size="10" fill="var(--ink-3)" text-anchor="middle">${axisDate(v.uploaded_at)}</text>`;
    }
  });

  let hoverElements = "";
  if (hoverIdx !== null && hoverIdx >= 0 && hoverIdx < chartVideos.length) {
    const hV = chartVideos[hoverIdx];
    const hX = getX(hoverIdx);
    hoverElements = `
      <line x1="${hX.toFixed(1)}" y1="${padT}" x2="${hX.toFixed(1)}" y2="${H - padB}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 2" />
      ${(hV.actual_views !== null && showViews) ? `<circle cx="${hX.toFixed(1)}" cy="${getYViews(hV.actual_views).toFixed(1)}" r="5" fill="var(--signal)" stroke="var(--paper)" stroke-width="1.5" />` : ""}
    `;
  }

  return `
    <div class="section-header">
      <div>
        <div class="section-title">Fig. 1 — Daily views vs forecast corridor, with retention</div>
        <div class="section-sub">${esc(dateSpan)}</div>
      </div>
      <div class="chart-controls">
        <div class="btn-group">
          <button class="btn ${chartRange === '7' ? 'active' : ''}" onclick="setChartRange('7')">7V</button>
          <button class="btn ${chartRange === '14' ? 'active' : ''}" onclick="setChartRange('14')">14V</button>
          <button class="btn ${chartRange === '30' ? 'active' : ''}" onclick="setChartRange('30')">30V</button>
          <button class="btn ${chartRange === 'all' ? 'active' : ''}" onclick="setChartRange('all')">All</button>
        </div>
        <div class="btn-group">
          <button class="btn ${showViews ? 'active' : ''}" onclick="toggleSeries('views')">
            <span class="swatch" style="background:var(--signal)"></span>Views
          </button>
          <button class="btn ${showRetention ? 'active' : ''}" onclick="toggleSeries('retention')">
            <span class="swatch" style="background:var(--slate)"></span>Retention
          </button>
          <button class="btn ${showForecast ? 'active' : ''}" onclick="toggleSeries('forecast')">
            <span class="swatch" style="background:var(--wash); border:1px dashed var(--slate)"></span>Corridor
          </button>
        </div>
      </div>
    </div>
    <div class="chart-container" style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" role="img"
           onmousemove="handleChartHover(event, ${chartVideos.length})"
           onmouseleave="hideChartHover()">
        ${gridlines}
        ${yLabels}
        ${xLabels}
        ${forecastBands}
        ${viewsPath}
        ${retPath}
        ${viewsDots}
        ${hoverElements}
      </svg>
      ${renderChartTooltip(chartVideos)}
    </div>
  `;
}

function renderCIBudget(ci) {
  if (!ci || !ci.available) {
    return `
      <div class="section-header"><div class="section-title">CI/CD Budget</div></div>
      <div class="card-box" style="color:var(--ink-3)">CI status unavailable</div>
    `;
  }
  const pct = ci.percent_used ?? 0;
  const bandCls = pct >= 90 ? 'critical' : pct >= 70 ? 'warning' : 'good';
  const { year: istYear, month: istMonth, day: istDay } = istTodayYMD();
  const dayOfMonth = Math.max(1, istDay);
  // Pure calendar arithmetic (no real moment-in-time involved), safe to do
  // with local Date methods once year/month are already IST-derived above.
  const daysInMonth = new Date(istYear, istMonth, 0).getDate();
  const projectedMin = Math.round((ci.used_minutes / dayOfMonth) * daysInMonth);

  return `
    <div class="section-header">
      <div class="section-title">CI/CD Budget</div>
      <div class="section-sub num">${ci.used_minutes} / ${ci.budget_minutes} min (${pct}%)</div>
    </div>
    <div class="card-box">
      <div class="ci-progress-bar">
        <div class="ci-fill ${bandCls}" style="width:${Math.min(100, pct)}%"></div>
        <div class="ci-marker" style="left:70%" title="70% warning threshold"></div>
        <div class="ci-marker" style="left:90%" title="90% critical threshold"></div>
      </div>
      <div class="ci-meta num">
        <span>Runs counted: ${ci.runs_counted || 0}</span>
        <span>Projected month-end: ~${projectedMin} min</span>
      </div>
    </div>
  `;
}

function renderIncidents(failures) {
  if (!failures || !failures.available) {
    return `
      <div class="section-header"><div class="section-title">Incidents</div></div>
      <div class="card-box" style="color:var(--ink-3)">Incidents status unavailable</div>
    `;
  }

  const list = failures.failures || [];
  if (list.length === 0) {
    return `
      <div class="section-header">
        <div class="section-title">Incidents</div>
        <div class="section-sub" style="color:var(--good); font-weight:500;">● No failed runs recently</div>
      </div>
    `;
  }

  return `
    <div class="section-header">
      <div class="section-title">Incidents <span class="badge signal">${list.length}</span></div>
      <a href="https://github.com/hammaadban111-art/my-youtube-agent/actions" target="_blank" rel="noopener" class="btn">View Actions ↗</a>
    </div>
    <div class="failures-list">
      ${list.map(f => `
        <div class="failure-item">
          <div class="failure-head">
            <span class="failure-wf">${esc(f.workflow)}</span>
            <span class="failure-time">${ago(f.created_at)}</span>
          </div>
          <div class="failure-err">${esc(f.error)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderTopPerformers(topPerformers) {
  if (!topPerformers || !topPerformers.length) return "";
  return `
    <div class="section-header">
      <div class="section-title">Top Performers</div>
      <div class="section-sub">The same ranking used internally to steer future topics</div>
    </div>
    <div class="top-performers-list">
      ${topPerformers.map((tp, idx) => `
        <div class="tp-row">
          <span class="tp-rank num">${idx + 1}</span>
          <div class="tp-main">
            <span class="tp-subject">${esc(tp.subject)}</span>
            <span class="tp-title">${esc(tp.title)}</span>
          </div>
          <span class="tp-views num">${num(tp.views)} views</span>
        </div>
      `).join("")}
    </div>
  `;
}

function setFilter(filter) {
  activeFilter = filter;
  renderApp();
}

function setSort(sortVal) {
  sortOrder = sortVal;
  renderApp();
}

function onSearchInput(evt) {
  searchQuery = evt.target.value;
  renderVideoTableOnly();
}

function renderFactCheckBadge(fc) {
  if (!fc || fc.status !== "checked") {
    return `<span class="badge dim" title="This video's claims have not been fact-checked yet">Not yet verified</span>`;
  }
  if (fc.unverified_source) {
    return `<span class="badge dim" title="No matching reference article was found so claims were never confirmed either way">Could not be fact-checked</span>`;
  }
  const checked = fc.checked || 0;
  const contradicted = (fc.contradicted || 0) + (fc.misleading || 0);
  if (contradicted > 0) {
    const label = contradicted === 1 ? "1 fact corrected before upload" : `${contradicted} facts corrected before upload`;
    return `<span class="badge signal" title="${contradicted} of ${checked} claims were found incorrect or misleading and fixed automatically before this video was uploaded - not a live problem">${esc(label)}</span>`;
  }
  if (fc.resolution_grounded === false) {
    return `<span class="badge signal" title="The video's closing claim could not be verified against the source article">Ending unverified</span>`;
  }
  return `<span class="badge good" title="${checked - contradicted} of ${checked} claims checked and confirmed against a source article">Facts verified</span>`;
}

function plainDegradation(d) {
  const stage = (d.stage || "").toLowerCase();
  const plain = {
    "upload-velocity": "Upload pace check: OK",
    "youtube-upload": "Upload hiccup: recovered automatically",
    "edge-tts": "Voice: used backup narration voice",
    "pexels": "Footage: used backup stock clips",
    "backfill": "Historical data: added after the fact, not a live 5-hour reading",
  }[stage] || ("System note: " + stage.replace(/-/g, " "));
  const detail = `${d.stage}: ${d.fallback}`;
  return `<span title="${esc(detail)}">${esc(plain)}</span>`;
}

function renderVideoTableOnly() {
  const container = document.getElementById("videoTableContainer");
  const countEl = document.getElementById("videoCountLabel");
  if (!container || !DATA || !DATA.videos) return;

  let list = DATA.videos.slice();

  // Search filter
  const q = (searchQuery || "").trim().toLowerCase();
  if (q) {
    list = list.filter(v =>
      (v.title || "").toLowerCase().includes(q) ||
      (v.topic || "").toLowerCase().includes(q)
    );
  }

  // Filter chips
  if (activeFilter === "over") {
    list = list.filter(v => v.error_pct !== null && v.error_pct !== undefined && v.error_pct > 10);
  } else if (activeFilter === "under") {
    list = list.filter(v => v.error_pct !== null && v.error_pct !== undefined && v.error_pct < -10);
  } else if (activeFilter === "flagged") {
    list = list.filter(v => {
      const fc = v.fact_check || {};
      return (fc.contradicted > 0) || (fc.resolution_grounded === false);
    });
  }

  // Sorting
  if (sortOrder === "views") {
    list.sort((a, b) => (b.actual_views ?? -Infinity) - (a.actual_views ?? -Infinity));
  } else if (sortOrder === "miss") {
    list.sort((a, b) => {
      const valA = (a.error_pct !== null && a.error_pct !== undefined) ? Math.abs(a.error_pct) : -Infinity;
      const valB = (b.error_pct !== null && b.error_pct !== undefined) ? Math.abs(b.error_pct) : -Infinity;
      return valB - valA;
    });
  } else if (sortOrder === "engagement") {
    list.sort((a, b) => (b.engagement_rate ?? -Infinity) - (a.engagement_rate ?? -Infinity));
  }

  if (countEl) countEl.textContent = `${list.length} of ${DATA.videos.length} videos`;

  if (!list.length) {
    container.innerHTML = `<div class="empty-state">No shorts match those filters.</div>`;
    return;
  }

  container.innerHTML = list.map(v => {
    const isMeasured = v.actual_views !== null && v.actual_views !== undefined;
    const viewsHtml = isMeasured
      ? `${num(v.actual_views)} ${v.error_pct !== null && v.error_pct !== undefined ? `<span class="delta-pill ${v.error_pct >= 0 ? 'pos' : 'neg'}">${v.error_pct >= 0 ? '+' : ''}${v.error_pct}%</span>` : ''}`
      : `<i class="pending">pending</i>`;

    const forecastVal = v.predicted_range || (v.predicted_views !== null ? num(v.predicted_views) : "—");

    const retEnd = (v.retention && v.retention.available && v.retention.retention_at_end !== null && v.retention.retention_at_end !== undefined)
      ? Math.round(v.retention.retention_at_end * 100) + "%"
      : "—";

    const sparklineSvg = (v.retention && v.retention.available && v.retention.curve && v.retention.curve.length)
      ? retentionSparkline(v.retention.curve)
      : "";

    const dropAt = (v.retention && v.retention.biggest_drop_at !== null && v.retention.biggest_drop_at !== undefined)
      ? Math.round(v.retention.biggest_drop_at * 100) + "%"
      : "—";

    const engRate = (v.engagement_rate !== null && v.engagement_rate !== undefined)
      ? v.engagement_rate + "%"
      : "—";

    const fcBadge = renderFactCheckBadge(v.fact_check);

    const degrHtml = (v.degradations && v.degradations.length)
      ? `<div class="row-degradation">${v.degradations.map(plainDegradation).join(' · ')}</div>`
      : "";

    return `
      <div class="video-row">
        <div class="row-line1">
          <span class="row-num num">${v.n}.</span>
          <span class="row-title">
            <a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          </span>
          ${fcBadge}
          <span class="num" style="color:var(--ink-3); font-size:11px">${ago(v.uploaded_at)}</span>
          <span class="row-views num">${viewsHtml}</span>
        </div>
        <div class="row-line2 num">
          <span class="row-stat">Forecast: <b>${esc(forecastVal)}</b></span>
          <span class="row-stat">Retention: <b>${retEnd}</b> ${sparklineSvg}</span>
          <span class="row-stat">Drop-off: <b>${dropAt}</b></span>
          <span class="row-stat">Engage: <b>${engRate}</b></span>
          <span class="row-stat">Likes: <b>${num(v.likes)}</b></span>
          <span class="row-stat">Comments: <b>${num(v.comments)}</b></span>
          <span class="row-stat">${freshnessRowHtml(v)}</span>
          ${replaceButtonHtml(v)}
        </div>
        ${degrHtml}
      </div>
    `;
  }).join("");
}

/* Replace = delete this video from YouTube and re-upload it from its stored
   re-use bundle. Only offered where a bundle exists — without one there is
   nothing to re-render from. Nothing happens on this page: the button opens a
   confirmation dialog, and confirming sends the operator to the workflow in
   the PRIVATE repo, where GitHub's login is the real authorisation. A public
   static page holds no credentials and must never be able to delete anything
   on its own. */
function replaceButtonHtml(v) {
  if (!v.reuse || !v.video_id) return "";
  if (v.replaced_by) return `<span class="row-stat" style="color:var(--ink-3)">replaced</span>`;
  const q = (DATA && DATA.quota) || {};
  const affordable = q.can_reupload !== false;
  const title = affordable
    ? "Delete from YouTube and re-upload from the stored bundle"
    : `Not enough quota headroom today (${q.units_used}/${q.daily_cap} units used, ${q.reupload_cost} needed)`;
  return `<button class="btn-replace" title="${esc(title)}" ${affordable ? "" : "disabled"}
            onclick="openReplaceModal('${esc(v.video_id)}')">Replace</button>`;
}

function openReplaceModal(videoId) {
  const v = (DATA.videos || []).find(x => x.video_id === videoId);
  if (!v) return;
  const q = DATA.quota || {};
  const reuse = v.reuse || {};
  const repo = DATA.repo || "";
  const workflowUrl = repo
    ? `https://github.com/${repo}/actions/workflows/reupload.yml`
    : "";
  const cmd = `gh workflow run reupload.yml -f video_id=${videoId} -f confirm=${videoId} -f dry_run=false`;

  const legacyWarn = reuse.legacy_generic_queries
    ? `<div class="modal-warn"><b>Stock footage will be re-chosen.</b> This video's
         saved search queries predate the anchored-visual fix, so re-rendering them
         as-is would bring back the generic footage that fix removed. The re-upload
         writes fresh queries first — that costs one Gemini call, out of 20/day.</div>`
    : "";

  const quotaLine = q.can_reupload === false
    ? `<div class="modal-warn">Blocked: ${q.units_used} of ${q.daily_cap} quota units already
         used today. A replace needs ${q.reupload_cost} and must leave the reserve the day's
         scheduled reads run on. The workflow will refuse this too.</div>`
    : `<li>Costs <b>${q.reupload_cost}</b> quota units (${q.upload_cost} upload +
         ${q.delete_cost} delete). Used so far today: ${q.units_used} of ${q.daily_cap}.</li>`;

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeReplaceModal()">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>Replace this video?</h3>
        <div style="font-size:12px;color:var(--ink-2)">${esc(v.title)}</div>
        <div class="modal-warn"><b>The current video is deleted from YouTube permanently.</b>
          Its ${v.actual_views === null || v.actual_views === undefined ? "views" : num(v.actual_views) + " views"},
          likes and comments go with it. This cannot be undone.</div>
        <ul>
          <li>Re-renders from the saved bundle — narration, voice and timing are reused,
              so there is <b>no</b> Gemini call for the script itself.</li>
          <li>Re-downloads ${reuse.pexels_downloads_needed || "the"} B-roll clips from Pexels
              (free tier) — clip ids were never saved.</li>
          ${quotaLine}
          <li>Uploads the new copy <b>first</b>, deletes the old one only after that
              succeeds. A failed render can never leave you with nothing.</li>
        </ul>
        ${legacyWarn}
        <div style="font-size:12px;color:var(--ink-2);margin-top:14px">
          This page has no credentials and cannot delete anything itself. Confirming
          opens the workflow in the private repo, where you sign in to run it:</div>
        <pre class="modal-cmd">${esc(cmd)}</pre>
        <div class="modal-actions">
          <button class="btn" onclick="closeReplaceModal()">Cancel</button>
          <button class="btn" onclick="copyReplaceCommand('${esc(cmd)}')">Copy command</button>
          ${workflowUrl
            ? `<a class="btn active" href="${esc(workflowUrl)}" target="_blank" rel="noopener"
                 onclick="closeReplaceModal()">Open the workflow</a>`
            : `<span class="row-stat" style="color:var(--ink-3)">repo unknown — use the command</span>`}
        </div>
      </div>
    </div>`;
}

function closeReplaceModal() {
  const root = document.getElementById("modalRoot");
  if (root) root.innerHTML = "";
}

function copyReplaceCommand(cmd) {
  if (navigator.clipboard) navigator.clipboard.writeText(cmd);
}

function renderPublishedShorts(videos) {
  if (!videos) return "";
  return `
    <div class="section-header">
      <div class="section-title">Published Shorts</div>
      <div class="section-sub num" id="videoCountLabel">${videos.length} of ${videos.length} videos</div>
    </div>
    <div class="table-controls">
      <input type="text" id="searchInput" class="input-text" placeholder="Search title or topic..." value="${esc(searchQuery)}" oninput="onSearchInput(event)" />
      <div class="btn-group">
        <button class="btn ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
        <button class="btn ${activeFilter === 'over' ? 'active' : ''}" onclick="setFilter('over')">Over (+10%)</button>
        <button class="btn ${activeFilter === 'under' ? 'active' : ''}" onclick="setFilter('under')">Under (-10%)</button>
        <button class="btn ${activeFilter === 'flagged' ? 'active' : ''}" onclick="setFilter('flagged')">Flagged</button>
      </div>
      <select id="sortSelect" class="select-box" onchange="setSort(this.value)">
        <option value="newest" ${sortOrder === 'newest' ? 'selected' : ''}>Newest</option>
        <option value="views" ${sortOrder === 'views' ? 'selected' : ''}>Most views</option>
        <option value="miss" ${sortOrder === 'miss' ? 'selected' : ''}>Biggest miss</option>
        <option value="engagement" ${sortOrder === 'engagement' ? 'selected' : ''}>Best engagement</option>
      </select>
    </div>
    <div class="table-container" id="videoTableContainer"></div>
  `;
}

function renderComments(videos) {
  let comments = [];
  (videos || []).forEach(v => {
    if (v.top_comments && v.top_comments.length) {
      v.top_comments.forEach(c => {
        comments.push({
          author: c.author,
          text: c.text,
          likes: c.likes || 0,
          topic: v.topic
        });
      });
    }
  });
  if (!comments.length) return "";
  comments.sort((a, b) => b.likes - a.likes);
  const top8 = comments.slice(0, 8);

  return `
    <div class="section-header">
      <div class="section-title">Comment Highlights</div>
      <div class="section-sub">Top comments by audience engagement</div>
    </div>
    <div class="comments-grid">
      ${top8.map(c => `
        <blockquote class="comment-card">
          <div class="comment-topic">${esc(c.topic || "General")}</div>
          <p class="comment-body">“${esc(c.text)}”</p>
          <div class="comment-footer">
            <span class="comment-author">— ${esc(c.author)}</span>
            <span class="comment-likes num">♥ ${c.likes}</span>
          </div>
        </blockquote>
      `).join("")}
    </div>
  `;
}

function renderFooter(d) {
  const lastRefreshed = d ? istDateTime(d.generated_at) : "—";
  const nextCheck = (d && d.next_runs && d.next_runs.length) ? istDateTime(d.next_runs[0]) : "—";
  return `
    <footer class="site-footer">
      <div class="footer-rule"></div>
      <div class="footer-text num">Last refreshed: ${esc(lastRefreshed)} · Next check: ${esc(nextCheck)}</div>
    </footer>
  `;
}

function renderApp() {
  if (!DATA) return;
  const app = document.getElementById("app");
  if (!app) return;

  app.innerHTML = `
    ${renderHeader()}
    ${renderStatusStrip(DATA)}
    ${renderSelfImproveBanner(DATA.summary)}
    ${renderChannelSummary(DATA)}
    ${renderChannelTotalChart(DATA.videos)}
    ${renderSpotlightSection(DATA.spotlight)}
    ${renderCIBudget(DATA.ci)}
    ${renderIncidents(DATA.failures)}
    ${renderTopPerformers(DATA.top_performers)}
    ${renderPublishedShorts(DATA.videos)}
    ${renderComments(DATA.videos)}
    ${renderChartSection(DATA.videos)}
    ${renderFooter(DATA)}
  `;

  renderVideoTableOnly();
}

function tick() {
  if (!DATA) return;
  const el = document.getElementById("freshnessPill");
  if (el) {
    el.textContent = `data fresh ${ago(DATA.generated_at)}`;
  }
}

async function load() {
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    lastFetch = Date.now();
    renderApp();
  } catch (e) {
    if (!DATA) {
      const app = document.getElementById("app");
      if (app) app.innerHTML = `<div class="empty-state">Could not load data.json (${esc(e.message)}).</div>`;
    }
  }
}

initTheme();
load();
setInterval(load, REFRESH_MS);
setInterval(tick, 1000);
</script>
</body></html>
